<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Día de la madre - iCo Medios</title>
  <meta http-equiv="refresh" content="180">

 <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@1,800&display=swap" rel="stylesheet">
  <style>

    html, body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    .contenedor {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* VIDEO */
    video#fondoVideo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* CONTENEDOR GENERAL */
    #nombres {
      position: absolute;
      left: 50%;
      bottom: 7vh;
      transform: translateX(-50%);
      width: 85vw;
      text-align: center;
      z-index: 3;
    }

    /* NOMBRE MAMÁ */
    .nombre {
      position: relative;
      color: #FFDBCC;
      font-size: 4vw;
      font-family: "Open Sans", sans-serif;
      font-weight: 400;
      margin-bottom: 2vh;

      opacity: 0;
      transition: opacity 0.8s ease;
    }

    /* DICHO */
    .dicho {
      position: relative;
      color: #F3574A;
      font-size: 2.6vw;
      line-height: 1.2;
      font-family: "Open Sans", sans-serif;
      font-weight: 400;

      padding: 0 4vw;
      box-sizing: border-box;

      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .mostrar {
      opacity: 1;
    }

  </style>
</head>

<body>

  <div class="contenedor">

    <!-- VIDEO -->
    <video autoplay loop muted playsinline id="fondoVideo">
      <source src="fondo.mp4" type="video/mp4">
      Tu navegador no soporta video.
    </video>

    <!-- TEXTO -->
    <div id="nombres">

      <div class="nombre"></div>

      <div class="dicho"></div>

    </div>

  </div>

  <script>

    const url =
      "https://script.google.com/macros/s/AKfycbwdj28x2XpZ4nrzo8R67KA3E-OSm44CWrPCXRntUuJxBoZVOjPUeR_tyaSWTj7DIs9CVQ/exec";

    fetch(url)

      .then(res => res.json())

      .then(aprobados => {

        const elNombre =
          document.querySelector(".nombre");

        const elDicho =
          document.querySelector(".dicho");

        if (!aprobados || aprobados.length === 0) {

          elNombre.textContent = "";

          elDicho.textContent =
            "No hay mensajes aprobados";

          elDicho.classList.add("mostrar");

          return;
        }

        let index =
          Math.floor(Math.random() * aprobados.length);

        function mostrar(i) {

          elNombre.classList.remove("mostrar");
          elDicho.classList.remove("mostrar");

          setTimeout(() => {

            const item = aprobados[i];

            /* Nombre mamá */
            elNombre.textContent =
              item.mama
              ? item.mama.toUpperCase()
              : "--";

            /* Dicho */
            elDicho.textContent =
              item.dicho
              ? `"${item.dicho}"`
              : "";

            elNombre.classList.add("mostrar");
            elDicho.classList.add("mostrar");

          }, 300);
        }

        mostrar(index);

        setInterval(() => {

          index =
            (index + 1) % aprobados.length;

          mostrar(index);

        }, 5000);

      })

      .catch(error => {

        console.error(error);

        document.querySelector(".dicho").textContent =
          "Error cargando mensajes";

      });

  </script>
</body>
</html>
